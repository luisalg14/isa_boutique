<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Isa Boutique</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <img src="img/logo.png.png" alt="Logo Isa Boutique" class="logo">
        <h1>Productos</h1>
        <p>Nuestra colección disponible desde PostgreSQL</p>
    </header>

    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="Producto.html">Productos</a>
        <a href="index.html#contacto">Contacto</a>
        <a href="admin.html">Acceso Admin</a>
    </nav>

    <section class="galeria">
        <div id="contenedor-productos" class="contenedor-productos"></div>
    </section>

    <script>
        function formatoPrecio(valor) {
            return "$" + Number(valor).toLocaleString("es-CO");
        }

        async function comprarProductoBD(idProducto) {
            const cantidadTexto = prompt("¿Cuántas unidades desea comprar?");
            
            if (cantidadTexto === null) return;
            
            const cantidad = parseInt(cantidadTexto);
            
            if (isNaN(cantidad) || cantidad <= 0) {
                alert("Ingresa una cantidad válida.");
                return;
            }
            
            const cliente = prompt("Nombre del cliente:");
            
            if (cliente === null || cliente.trim() === "") {
                alert("Debes ingresar el nombre del cliente.");
                return;
            }
            
            const telefono = prompt("Teléfono del cliente:");
            
            if (telefono === null || telefono.trim() === "") {
                alert("Debes ingresar el teléfono del cliente.");
                return;
            }
            
            const medioPago = prompt(
                "Selecciona medio de pago:\n" +
                "1. Efectivo\n" +
                "2. Transferencia\n" +
                "3. Tarjeta débito\n" +
                "4. Tarjeta crédito"
            );
            
            if (medioPago === null) return;
            
            let medioTexto = "";
            
            if (medioPago === "1") {
                medioTexto = "efectivo";
            } else if (medioPago === "2") {
                medioTexto = "transferencia";
            } else if (medioPago === "3") {
                medioTexto = "tarjeta_debito";
            } else if (medioPago === "4") {
                medioTexto = "tarjeta_credito";
            } else {
                alert("Medio de pago no válido.");
                return;
            }
            
            const datos = new FormData();
            
            datos.append("id_producto", idProducto);
            datos.append("cantidad", cantidad);
            datos.append("cliente", cliente.trim());
            datos.append("telefono", telefono.trim());
            datos.append("medio_pago", medioTexto);
            
            try {
                const respuesta = await fetch("php/venta_registrar.php", {
                    method: "POST",
                    body: datos
                });

            const resultado = await respuesta.json();
            
            if (resultado.error) {
                alert(resultado.mensaje);
                return;
            }
            
            alert(resultado.mensaje + "\nTotal: " + formatoPrecio(resultado.total));
            
            cargarProductos();
        
        } catch (error) {
            alert("Error al registrar la venta.");
            console.error(error);
        }
    }
    
    async function cargarProductos() {
            const contenedor = document.getElementById("contenedor-productos");

            try {
                const respuesta = await fetch("php/productos_listar.php");
                const productos = await respuesta.json();

                contenedor.innerHTML = "";

                if (productos.error) {
                    contenedor.innerHTML = "<p>Error: " + productos.mensaje + "</p>";
                    return;
                }

                const productosVisibles = productos.filter(function(producto) {
                    return producto.estado !== "inactivo";
                });

                if (productosVisibles.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center;">No hay productos registrados todavía.</p>';
                    return;
                }

                productosVisibles.forEach(function(producto) {
                    let estadoTexto = producto.estado;

                    if (producto.cantidad == 0) {
                        estadoTexto = "agotado";
                    }

                    contenedor.innerHTML +=
                        '<div class="card">' +
                            '<img src="' + producto.imagen + '" alt="' + producto.nombre + '">' +
                            '<p><strong>Código:</strong> ' + producto.codigo + '</p>' +
                            '<h3>' + producto.nombre + '</h3>' +
                            '<p><strong>Marca:</strong> ' + producto.marca + '</p>' +
                            '<p><strong>Categoría:</strong> ' + producto.categoria + '</p>' +
                            '<p>' + formatoPrecio(producto.precio) + '</p>' +
                            '<p><strong>Disponibles:</strong> ' + producto.cantidad + '</p>' +
                            '<p><strong>Estado:</strong> ' + estadoTexto + '</p>' +
                            '<button class="boton-comprar" onclick="comprarProductoBD(' + producto.id_producto + ')">Comprar</button>' +
                            '</div>';
                });

            } catch (error) {
                contenedor.innerHTML = "<p>Error al cargar productos desde la base de datos.</p>";
                console.error(error);
            }
        }

        cargarProductos();
    </script>

</body>
</html>
