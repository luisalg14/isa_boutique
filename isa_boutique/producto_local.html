<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Isa Boutique</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <img src="img/logo.png.png" alt="Logo Isa Boutique" class="logo">
        <h1>Productos</h1>
        <p>Nuestra colección disponible</p>
    </header>

    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="Producto.html">Productos</a>
        <a href="index.html#contacto">Contacto</a>
        <a href="admin.html">Acceso Admin</a>
    </nav>

    <section class="galeria">
        <div id="contenedor-productos" class="contenedor-productos"></div>
    </section>

    <script src="js/inventario.js"></script>

    <script>
        function cargarProductos() {
            let productos = JSON.parse(localStorage.getItem("inventario")) || [];
            productos = productos.filter(function(producto) {
                return producto.activo !== false;
            });
            let contenedor = document.getElementById("contenedor-productos");

            contenedor.innerHTML = "";

            if (productos.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center;">No hay productos registrados todavía.</p>';
                return;
            }

            productos.forEach(function(producto) {
                contenedor.innerHTML +=
                    '<div class="card">' +
                        '<img src="' + producto.img + '" alt="' + producto.nombre + '">' +
                        '<p><strong>Código:</strong> ' + (producto.codigo || "Sin código") + '</p>' +
                        '<h3>' + producto.nombre + '</h3>' +
                        '<p><strong>Marca:</strong> ' + producto.marca + '</p>' +
                        '<p><strong>Categoría:</strong> ' + producto.tipo + '</p>' +
                        '<p>' + formatoPrecio(producto.precio) + '</p>' +
                        '<p><strong>Disponibles:</strong> ' + producto.cantidad + '</p>' +
                        '<a href="#" onclick="comprarPorId(' + producto.id + ')" class="boton-comprar">Comprar</a>' +
                    '</div>';
            });
        }

        cargarProductos();
    </script>

</body>
</html>
