<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Isa Boutique</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado tienda-hero">
        <img src="img/logo.png.png" alt="Logo Isa Boutique" class="logo">
        <h1>Catalogo Isa Boutique</h1>
        <p>Explora prendas disponibles, filtra por categoria y registra tu compra.</p>
    </header>

    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="Producto.html">Productos</a>
        <a href="index.html#contacto">Contacto</a>
    </nav>

    <main class="tienda-layout">
        <section class="tienda-toolbar">
            <div>
                <h2>Productos</h2>
                <p id="resumenCatalogo">Cargando catalogo...</p>
            </div>

            <div class="tienda-controles">
                <input id="buscarProducto" type="search" placeholder="Buscar por nombre, marca o codigo">

                <select id="filtroCategoria">
                    <option value="">Todas las categorias</option>
                    <option value="vestidos">Vestidos</option>
                    <option value="blusas">Blusas</option>
                    <option value="conjuntos">Conjuntos</option>
                    <option value="shorts">Shorts</option>
                    <option value="jeans">Jeans</option>
                    <option value="bodys">Bodys</option>
                    <option value="faldas">Faldas</option>
                    <option value="accesorios">Accesorios</option>
                </select>

                <select id="ordenProductos">
                    <option value="recientes">Orden original</option>
                    <option value="precio_asc">Menor precio</option>
                    <option value="precio_desc">Mayor precio</option>
                    <option value="stock_desc">Mas disponibles</option>
                </select>

                <label class="check-control">
                    <input id="soloDisponibles" type="checkbox" checked>
                    Solo disponibles
                </label>
            </div>

            <div class="categoria-chips" id="categoriaChips">
                <button class="chip activo" data-categoria="">Todo</button>
                <button class="chip" data-categoria="vestidos">Vestidos</button>
                <button class="chip" data-categoria="blusas">Blusas</button>
                <button class="chip" data-categoria="conjuntos">Conjuntos</button>
                <button class="chip" data-categoria="shorts">Shorts</button>
                <button class="chip" data-categoria="jeans">Jeans</button>
                <button class="chip" data-categoria="bodys">Bodys</button>
                <button class="chip" data-categoria="faldas">Faldas</button>
                <button class="chip" data-categoria="accesorios">Accesorios</button>
            </div>
        </section>

        <section class="galeria tienda-galeria">
            <div id="contenedor-productos" class="contenedor-productos"></div>
        </section>
    </main>

    <div id="modalCompra" class="modal-compra" aria-hidden="true">
        <form id="formCompra" class="compra-modal">
            <div class="modal-header">
                <h2>Confirmar compra</h2>
                <p id="resumenProducto">Selecciona un producto</p>
            </div>

            <div class="modal-body">
                <div class="campo">
                    <label for="compraCantidad">Cantidad</label>
                    <input id="compraCantidad" type="number" min="1" required>
                </div>

                <div class="campo">
                    <label for="compraCliente">Nombre del cliente</label>
                    <input id="compraCliente" required>
                </div>

                <div class="campo">
                    <label for="compraTelefono">Telefono</label>
                    <input id="compraTelefono" required>
                </div>

                <div class="campo">
                    <label for="compraMedioPago">Medio de pago</label>
                    <select id="compraMedioPago" required>
                        <option value="">Seleccionar</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="transferencia">Transferencia</option>
                        <option value="tarjeta_debito">Tarjeta debito</option>
                        <option value="tarjeta_credito">Tarjeta credito</option>
                    </select>
                </div>

                <p id="mensajeCompra" class="mensaje-compra"></p>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCancelarCompra">Cancelar</button>
                <button type="submit" class="btn-confirmar">Registrar compra</button>
            </div>
        </form>
    </div>

    <script>
        let productoSeleccionado = null;
        let productosCatalogo = [];

        const contenedor = document.getElementById("contenedor-productos");
        const buscador = document.getElementById("buscarProducto");
        const filtroCategoria = document.getElementById("filtroCategoria");
        const ordenProductos = document.getElementById("ordenProductos");
        const soloDisponibles = document.getElementById("soloDisponibles");
        const resumenCatalogo = document.getElementById("resumenCatalogo");

        function formatoPrecio(valor) {
            return "$" + Number(valor).toLocaleString("es-CO");
        }

        function formatearCategoria(categoria) {
            const nombres = {
                vestidos: "Vestidos",
                blusas: "Blusas",
                conjuntos: "Conjuntos",
                shorts: "Shorts",
                jeans: "Jeans",
                bodys: "Bodys",
                faldas: "Faldas",
                accesorios: "Accesorios"
            };

            return nombres[categoria] || categoria || "Sin categoria";
        }

        function abrirModalCompra(producto) {
            if (Number(producto.cantidad) <= 0 || producto.estado === "agotado") {
                alert("Este producto esta agotado.");
                return;
            }

            productoSeleccionado = producto;
            document.getElementById("resumenProducto").textContent =
                producto.nombre + " - " + formatoPrecio(producto.precio) + " | Disponibles: " + producto.cantidad;
            document.getElementById("compraCantidad").value = "1";
            document.getElementById("compraCantidad").max = producto.cantidad;
            document.getElementById("compraCliente").value = "";
            document.getElementById("compraTelefono").value = "";
            document.getElementById("compraMedioPago").value = "";
            document.getElementById("mensajeCompra").textContent = "";

            const modal = document.getElementById("modalCompra");
            modal.classList.add("activo");
            modal.setAttribute("aria-hidden", "false");
        }

        function cerrarModalCompra() {
            const modal = document.getElementById("modalCompra");
            modal.classList.remove("activo");
            modal.setAttribute("aria-hidden", "true");
            productoSeleccionado = null;
        }

        async function registrarCompra(evento) {
            evento.preventDefault();

            if (!productoSeleccionado) return;

            const cantidad = parseInt(document.getElementById("compraCantidad").value);
            const cliente = document.getElementById("compraCliente").value.trim();
            const telefono = document.getElementById("compraTelefono").value.trim();
            const medioPago = document.getElementById("compraMedioPago").value;
            const mensaje = document.getElementById("mensajeCompra");

            if (isNaN(cantidad) || cantidad <= 0) {
                mensaje.textContent = "Ingresa una cantidad valida.";
                return;
            }

            if (cantidad > Number(productoSeleccionado.cantidad)) {
                mensaje.textContent = "Solo hay " + productoSeleccionado.cantidad + " unidades disponibles.";
                return;
            }

            if (!cliente || !telefono || !medioPago) {
                mensaje.textContent = "Completa todos los campos.";
                return;
            }

            const datos = new FormData();
            datos.append("id_producto", productoSeleccionado.id_producto);
            datos.append("cantidad", cantidad);
            datos.append("cliente", cliente);
            datos.append("telefono", telefono);
            datos.append("medio_pago", medioPago);

            try {
                const respuesta = await fetch("php/venta_registrar.php", {
                    method: "POST",
                    body: datos
                });

                const resultado = await respuesta.json();

                if (resultado.error) {
                    mensaje.textContent = resultado.mensaje;
                    return;
                }

                alert(resultado.mensaje + "\nTotal: " + formatoPrecio(resultado.total));
                cerrarModalCompra();
                cargarProductos();
            } catch (error) {
                mensaje.textContent = "Error al registrar la compra.";
                console.error(error);
            }
        }

        function obtenerProductosFiltrados() {
            const texto = buscador.value.trim().toLowerCase();
            const categoria = filtroCategoria.value;
            const soloStock = soloDisponibles.checked;

            let productos = productosCatalogo.filter(function(producto) {
                const activo = producto.estado !== "inactivo";
                const disponible = Number(producto.cantidad) > 0 && producto.estado !== "agotado";
                const coincideTexto = (
                    (producto.nombre || "").toLowerCase().includes(texto) ||
                    (producto.marca || "").toLowerCase().includes(texto) ||
                    (producto.codigo || "").toLowerCase().includes(texto)
                );
                const coincideCategoria = !categoria || producto.categoria === categoria;

                return activo && coincideTexto && coincideCategoria && (!soloStock || disponible);
            });

            if (ordenProductos.value === "precio_asc") {
                productos.sort(function(a, b) { return Number(a.precio) - Number(b.precio); });
            } else if (ordenProductos.value === "precio_desc") {
                productos.sort(function(a, b) { return Number(b.precio) - Number(a.precio); });
            } else if (ordenProductos.value === "stock_desc") {
                productos.sort(function(a, b) { return Number(b.cantidad) - Number(a.cantidad); });
            }

            return productos;
        }

        function renderizarProductos() {
            const productos = obtenerProductosFiltrados();
            const totalVisibles = productosCatalogo.filter(function(producto) {
                return producto.estado !== "inactivo";
            }).length;

            contenedor.innerHTML = "";
            resumenCatalogo.textContent = productos.length + " de " + totalVisibles + " productos visibles";

            if (productos.length === 0) {
                contenedor.innerHTML = '<div class="estado-vacio">No encontramos productos con esos filtros.</div>';
                return;
            }

            productos.forEach(function(producto) {
                const agotado = Number(producto.cantidad) <= 0 || producto.estado === "agotado";
                const estadoTexto = agotado ? "Agotado" : "Disponible";
                const card = document.createElement("article");

                card.className = "card producto-card";
                card.innerHTML =
                    '<div class="producto-imagen-wrap">' +
                        '<img src="' + producto.imagen + '" alt="' + producto.nombre + '">' +
                        '<span class="producto-badge ' + (agotado ? "agotado" : "disponible") + '">' + estadoTexto + '</span>' +
                    '</div>' +
                    '<div class="producto-card-body">' +
                        '<p class="producto-codigo">Codigo: ' + producto.codigo + '</p>' +
                        '<h3>' + producto.nombre + '</h3>' +
                        '<p class="producto-meta">' + producto.marca + ' · ' + formatearCategoria(producto.categoria) + '</p>' +
                        '<p class="producto-precio">' + formatoPrecio(producto.precio) + '</p>' +
                        '<p class="producto-stock">' + producto.cantidad + ' unidades disponibles</p>' +
                        '<button class="boton-comprar" ' + (agotado ? "disabled" : "") + '>' +
                            (agotado ? "Agotado" : "Comprar") +
                        '</button>' +
                    '</div>';

                card.querySelector("button").addEventListener("click", function() {
                    abrirModalCompra(producto);
                });

                contenedor.appendChild(card);
            });
        }

        async function cargarProductos() {
            contenedor.innerHTML = '<div class="estado-vacio">Cargando productos...</div>';

            try {
                const respuesta = await fetch("php/productos_listar.php");
                const productos = await respuesta.json();

                if (productos.error) {
                    contenedor.innerHTML = "<p>Error: " + productos.mensaje + "</p>";
                    return;
                }

                productosCatalogo = productos;
                renderizarProductos();
            } catch (error) {
                contenedor.innerHTML = "<p>Error al cargar productos desde la base de datos.</p>";
                console.error(error);
            }
        }

        document.getElementById("formCompra").addEventListener("submit", registrarCompra);
        document.getElementById("btnCancelarCompra").addEventListener("click", cerrarModalCompra);
        document.getElementById("modalCompra").addEventListener("click", function(evento) {
            if (evento.target.id === "modalCompra") {
                cerrarModalCompra();
            }
        });

        buscador.addEventListener("input", renderizarProductos);
        filtroCategoria.addEventListener("change", function() {
            document.querySelectorAll(".chip").forEach(function(chip) {
                chip.classList.toggle("activo", chip.dataset.categoria === filtroCategoria.value);
            });
            renderizarProductos();
        });
        ordenProductos.addEventListener("change", renderizarProductos);
        soloDisponibles.addEventListener("change", renderizarProductos);

        document.querySelectorAll(".chip").forEach(function(chip) {
            chip.addEventListener("click", function() {
                filtroCategoria.value = chip.dataset.categoria;
                document.querySelectorAll(".chip").forEach(function(item) {
                    item.classList.remove("activo");
                });
                chip.classList.add("activo");
                renderizarProductos();
            });
        });

        cargarProductos();
    </script>

</body>
</html>
