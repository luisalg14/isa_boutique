<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Isa Boutique</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="public-page catalog-page stitch-catalog">

    <nav class="menu stitch-nav">
        <a class="nav-home-arrow" href="index.html" title="Volver al inicio">&larr;</a>
        <a class="brand-link" href="index.html">Isa Boutique</a>
        <a href="index.html">Inicio</a>
        <a href="Producto.html">Ver todo</a>
        <a href="categoria.html?tipo=blusas">Blusas</a>
        <a href="categoria.html?tipo=vestidos">Vestidos</a>
        <a href="categoria.html?tipo=conjuntos">Conjuntos</a>
        <a href="index.html#contacto">Contacto</a>
        <button class="cart-link" type="button" id="btnAbrirCarrito">Carrito <span id="cartCount">0</span></button>
    </nav>

    <main class="tienda-layout">
        <header class="catalog-header">
            <span>Colecciones</span>
            <h1>Moda femenina</h1>
            <p>Descubre prendas disponibles, filtra por categoría y registra tu compra.</p>
        </header>

        <div class="stitch-catalog-grid">
            <aside class="stitch-filters">
                <p id="resumenCatalogo">Cargando catalogo...</p>

                <label class="filter-label" for="buscarProducto">Buscar</label>
                <input id="buscarProducto" type="search" placeholder="Nombre, marca o codigo">

                <label class="filter-label" for="filtroCategoria">Categoria</label>
                <select id="filtroCategoria">
                    <option value="">Todas</option>
                </select>

                <label class="filter-label" for="ordenProductos">Orden</label>
                <select id="ordenProductos">
                    <option value="recientes">Orden original</option>
                    <option value="precio_asc">Menor precio</option>
                    <option value="precio_desc">Mayor precio</option>
                    <option value="stock_desc">Mas disponibles</option>
                </select>

                <label class="check-control">
                    <input id="soloDisponibles" type="checkbox" checked>
                    Solo disponibles
                </label>

                <div class="categoria-chips" id="categoriaChips">
                    <button class="chip activo" data-categoria="">Todo</button>
                </div>
            </aside>

            <section class="galeria tienda-galeria">
                <div id="contenedor-productos" class="contenedor-productos"></div>
            </section>
        </div>
    </main>

    <div id="modalCompra" class="modal-compra" aria-hidden="true">
        <form id="formCompra" class="compra-modal">
            <div class="modal-header">
                <h2>Confirmar compra</h2>
                <p id="resumenProducto">Selecciona un producto</p>
            </div>

            <div class="modal-body">
                <div class="campo">
                    <label for="compraTalla">Talla</label>
                    <input id="compraTalla" type="hidden" required>
                    <div id="compraTallaOpciones" class="size-options public-size-options"></div>
                </div>

                <div class="campo">
                    <label for="compraCantidad">Cantidad</label>
                    <input id="compraCantidad" type="number" min="1" required>
                </div>

                <div class="campo">
                    <label for="compraCliente">Nombre del cliente</label>
                    <input id="compraCliente" required>
                </div>

                <div class="campo">
                    <label for="compraTelefono">Telefono</label>
                    <input id="compraTelefono" required>
                </div>

                <div class="campo">
                    <label for="compraMedioPago">Medio de pago</label>
                    <select id="compraMedioPago" required>
                        <option value="">Seleccionar</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="transferencia">Transferencia</option>
                        <option value="tarjeta_debito">Tarjeta debito</option>
                        <option value="tarjeta_credito">Tarjeta credito</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="compraEntrega">Entrega</label>
                    <select id="compraEntrega" required>
                        <option value="">Seleccionar</option>
                        <option value="recoger_tienda">Recoger en tienda</option>
                        <option value="envio_local">Envio local</option>
                        <option value="envio_nacional">Envio nacional</option>
                    </select>
                </div>

                <p id="mensajeCompra" class="mensaje-compra"></p>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCancelarCompra">Cancelar</button>
                <button type="button" class="btn-cancelar" id="btnAgregarCarrito">Agregar al carrito</button>
                <button type="submit" class="btn-confirmar">Registrar compra</button>
            </div>
        </form>
    </div>

    <div id="modalCarrito" class="modal-compra" aria-hidden="true">
        <div class="compra-modal">
            <div class="modal-header">
                <h2>Carrito</h2>
                <p>Productos seleccionados antes de comprar.</p>
            </div>

            <div class="modal-body">
                <div id="listaCarrito" class="cart-list"></div>
                <p id="totalCarrito" class="producto-precio">$0</p>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCerrarCarrito">Cerrar</button>
                <button type="button" class="btn-confirmar" id="btnVaciarCarrito">Vaciar</button>
            </div>
        </div>
    </div>

    <script>
        let productoSeleccionado = null;
        let productosCatalogo = [];
        let categoriasCatalogo = [];
        let carrito = JSON.parse(localStorage.getItem("isa_carrito")) || [];

        const contenedor = document.getElementById("contenedor-productos");
        const buscador = document.getElementById("buscarProducto");
        const filtroCategoria = document.getElementById("filtroCategoria");
        const ordenProductos = document.getElementById("ordenProductos");
        const soloDisponibles = document.getElementById("soloDisponibles");
        const resumenCatalogo = document.getElementById("resumenCatalogo");

        function formatoPrecio(valor) {
            return "$" + Number(valor).toLocaleString("es-CO");
        }

        function rutaImagenProducto(ruta) {
            if (!ruta) return "../img/logo.png.png";
            if (ruta.startsWith("http") || ruta.startsWith("../")) return ruta;
            if (ruta.startsWith("img/")) return "../" + ruta;
            return ruta;
        }

        function formatearCategoria(categoria) {
            const encontrada = categoriasCatalogo.find(function(item) {
                return item.nombre === categoria;
            });

            if (encontrada) {
                return encontrada.nombre.replaceAll("-", " ").replace(/\b\w/g, function(letra) {
                    return letra.toUpperCase();
                });
            }

            return categoria ? categoria.replaceAll("-", " ") : "Sin categoría";
        }

        function leerTallas(tallas) {
            if (Array.isArray(tallas)) return tallas;

            if (typeof tallas === "string" && tallas.trim() !== "") {
                try {
                    return JSON.parse(tallas);
                } catch (error) {
                    return [];
                }
            }

            return [];
        }

        function textoTallas(tallas) {
            const lista = leerTallas(tallas);

            if (lista.length === 0) return "Sin tallas disponibles";

            return "Tallas disponibles: " + lista.map(function(item) {
                const cantidad = Number(item.cantidad);

                if (cantidad <= 0) {
                    return item.talla + " agotada";
                }

                if (cantidad < 4) {
                    return item.talla + " (ultimas " + cantidad + ")";
                }

                return item.talla;
            }).join(", ");
        }

        function actualizarContadorCarrito() {
            const total = carrito.reduce(function(suma, item) {
                return suma + Number(item.cantidad);
            }, 0);

            document.getElementById("cartCount").textContent = total;
        }

        function guardarCarrito() {
            localStorage.setItem("isa_carrito", JSON.stringify(carrito));
            actualizarContadorCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById("listaCarrito");
            const total = carrito.reduce(function(suma, item) {
                return suma + Number(item.precio) * Number(item.cantidad);
            }, 0);

            if (carrito.length === 0) {
                lista.innerHTML = '<p>Tu carrito esta vacio.</p>';
                document.getElementById("totalCarrito").textContent = "$0";
                return;
            }

            lista.innerHTML = "";

            carrito.forEach(function(item, indice) {
                const fila = document.createElement("div");
                fila.className = "cart-item";
                fila.innerHTML =
                    '<div>' +
                        '<strong>' + item.nombre + '</strong>' +
                        '<p>Talla: ' + item.talla + ' | Cantidad: ' + item.cantidad + '</p>' +
                        '<p>' + formatoPrecio(Number(item.precio) * Number(item.cantidad)) + '</p>' +
                    '</div>' +
                    '<button type="button">Quitar</button>';

                fila.querySelector("button").addEventListener("click", function() {
                    carrito.splice(indice, 1);
                    guardarCarrito();
                    renderizarCarrito();
                });

                lista.appendChild(fila);
            });

            document.getElementById("totalCarrito").textContent = "Total carrito: " + formatoPrecio(total);
        }

        function abrirCarrito() {
            renderizarCarrito();
            const modal = document.getElementById("modalCarrito");
            modal.classList.add("activo");
            modal.setAttribute("aria-hidden", "false");
        }

        function cerrarCarrito() {
            const modal = document.getElementById("modalCarrito");
            modal.classList.remove("activo");
            modal.setAttribute("aria-hidden", "true");
        }

        function llenarTallasCompra(producto) {
            const input = document.getElementById("compraTalla");
            const contenedor = document.getElementById("compraTallaOpciones");
            input.value = "";
            contenedor.innerHTML = "";

            leerTallas(producto.tallas)
                .forEach(function(item) {
                    const cantidad = Number(item.cantidad);
                    const boton = document.createElement("button");
                    boton.type = "button";
                    boton.className = "size-option";
                    boton.dataset.talla = item.talla;
                    boton.dataset.cantidad = item.cantidad;
                    boton.disabled = cantidad <= 0;
                    boton.textContent = cantidad > 0 && cantidad < 4
                        ? item.talla + " - ultimas " + cantidad
                        : item.talla;

                    if (cantidad <= 0) {
                        boton.classList.add("agotada");
                        boton.title = "Talla agotada";
                    }

                    boton.addEventListener("click", function() {
                        if (boton.disabled) return;
                        input.value = item.talla;
                        document.getElementById("compraCantidad").max = item.cantidad;
                        contenedor.querySelectorAll(".size-option").forEach(function(opcion) {
                            opcion.classList.toggle("activo", opcion === boton);
                        });
                    });
                    contenedor.appendChild(boton);
                });

            const primera = contenedor.querySelector(".size-option:not(:disabled)");
            if (primera) {
                primera.click();
            }
        }

        function abrirModalCompra(producto) {
            if (Number(producto.cantidad) <= 0 || producto.estado === "agotado") {
                alert("Este producto esta agotado.");
                return;
            }

            productoSeleccionado = producto;
            document.getElementById("resumenProducto").textContent =
                producto.nombre + " - " + formatoPrecio(producto.precio) + " | Disponibles: " + producto.cantidad;
            document.getElementById("compraCantidad").value = "1";
            document.getElementById("compraCantidad").max = producto.cantidad;
            llenarTallasCompra(producto);
            document.getElementById("compraCliente").value = "";
            document.getElementById("compraTelefono").value = "";
            document.getElementById("compraMedioPago").value = "";
            document.getElementById("mensajeCompra").textContent = "";

            const modal = document.getElementById("modalCompra");
            modal.classList.add("activo");
            modal.setAttribute("aria-hidden", "false");
        }

        function cerrarModalCompra() {
            const modal = document.getElementById("modalCompra");
            modal.classList.remove("activo");
            modal.setAttribute("aria-hidden", "true");
            productoSeleccionado = null;
        }

        async function registrarCompra(evento) {
            evento.preventDefault();

            if (!productoSeleccionado) return;

            const cantidad = parseInt(document.getElementById("compraCantidad").value);
            const talla = document.getElementById("compraTalla").value;
            const cliente = document.getElementById("compraCliente").value.trim();
            const telefono = document.getElementById("compraTelefono").value.trim();
            const medioPago = document.getElementById("compraMedioPago").value;
            const tipoEntrega = document.getElementById("compraEntrega").value;
            const mensaje = document.getElementById("mensajeCompra");

            if (isNaN(cantidad) || cantidad <= 0) {
                mensaje.textContent = "Ingresa una cantidad valida.";
                return;
            }

            if (!talla) {
                mensaje.textContent = "Selecciona una talla.";
                return;
            }

            const tallaSeleccionada = leerTallas(productoSeleccionado.tallas).find(function(item) {
                return item.talla === talla;
            });

            if (!tallaSeleccionada || cantidad > Number(tallaSeleccionada.cantidad)) {
                mensaje.textContent = "No hay suficientes unidades en esa talla.";
                return;
            }

            if (!cliente || !telefono || !medioPago || !tipoEntrega) {
                mensaje.textContent = "Completa todos los campos.";
                return;
            }

            const datos = new FormData();
            datos.append("id_producto", productoSeleccionado.id_producto);
            datos.append("talla", talla);
            datos.append("cantidad", cantidad);
            datos.append("cliente", cliente);
            datos.append("telefono", telefono);
            datos.append("medio_pago", medioPago);
            datos.append("canal_venta", "pagina_web");
            datos.append("tipo_entrega", tipoEntrega);

            try {
                const respuesta = await fetch("../php/venta_registrar.php", {
                    method: "POST",
                    body: datos
                });

                const resultado = await respuesta.json();

                if (resultado.error) {
                    mensaje.textContent = resultado.mensaje;
                    return;
                }

                const idProductoComprado = productoSeleccionado.id_producto;
                alert(resultado.mensaje + "\nEstado: " + resultado.estado + "\nTotal: " + formatoPrecio(resultado.total));
                carrito = carrito.filter(function(item) {
                    return !(Number(item.id_producto) === Number(idProductoComprado) && item.talla === talla);
                });
                guardarCarrito();
                cerrarModalCompra();
                cargarProductos();
            } catch (error) {
                mensaje.textContent = "Error al registrar la compra.";
                console.error(error);
            }
        }

        function agregarProductoAlCarrito() {
            if (!productoSeleccionado) return;

            const cantidad = parseInt(document.getElementById("compraCantidad").value);
            const talla = document.getElementById("compraTalla").value;
            const mensaje = document.getElementById("mensajeCompra");

            if (!talla) {
                mensaje.textContent = "Selecciona una talla.";
                return;
            }

            if (isNaN(cantidad) || cantidad <= 0) {
                mensaje.textContent = "Ingresa una cantidad valida.";
                return;
            }

            carrito.push({
                id_producto: productoSeleccionado.id_producto,
                codigo: productoSeleccionado.codigo,
                nombre: productoSeleccionado.nombre,
                precio: productoSeleccionado.precio,
                talla: talla,
                cantidad: cantidad
            });

            guardarCarrito();
            cerrarModalCompra();
            abrirCarrito();
        }

        function obtenerProductosFiltrados() {
            const texto = buscador.value.trim().toLowerCase();
            const categoria = filtroCategoria.value;
            const soloStock = soloDisponibles.checked;

            let productos = productosCatalogo.filter(function(producto) {
                const activo = producto.estado !== "inactivo";
                const disponible = Number(producto.cantidad) > 0 && producto.estado !== "agotado";
                const coincideTexto = (
                    (producto.nombre || "").toLowerCase().includes(texto) ||
                    (producto.marca || "").toLowerCase().includes(texto) ||
                    (producto.codigo || "").toLowerCase().includes(texto)
                );
                const coincideCategoria = !categoria || producto.categoria === categoria;

                return activo && coincideTexto && coincideCategoria && (!soloStock || disponible);
            });

            if (ordenProductos.value === "precio_asc") {
                productos.sort(function(a, b) { return Number(a.precio) - Number(b.precio); });
            } else if (ordenProductos.value === "precio_desc") {
                productos.sort(function(a, b) { return Number(b.precio) - Number(a.precio); });
            } else if (ordenProductos.value === "stock_desc") {
                productos.sort(function(a, b) { return Number(b.cantidad) - Number(a.cantidad); });
            }

            return productos;
        }

        async function cargarCategoriasCatalogo() {
            try {
                const respuesta = await fetch("../php/categorias_listar.php?solo_activas=1");
                const categorias = await respuesta.json();

                if (categorias.error) {
                    console.error(categorias.mensaje);
                    return;
                }

                categoriasCatalogo = categorias;
                filtroCategoria.innerHTML = '<option value="">Todas</option>';
                document.getElementById("categoriaChips").innerHTML = '<button class="chip activo" data-categoria="">Todo</button>';

                categorias.forEach(function(categoria) {
                    const texto = formatearCategoria(categoria.nombre);
                    const opcion = document.createElement("option");
                    opcion.value = categoria.nombre;
                    opcion.textContent = texto;
                    filtroCategoria.appendChild(opcion);

                    const chip = document.createElement("button");
                    chip.className = "chip";
                    chip.dataset.categoria = categoria.nombre;
                    chip.textContent = texto;
                    chip.addEventListener("click", function() {
                        filtroCategoria.value = chip.dataset.categoria;
                        document.querySelectorAll(".chip").forEach(function(item) {
                            item.classList.remove("activo");
                        });
                        chip.classList.add("activo");
                        renderizarProductos();
                    });
                    document.getElementById("categoriaChips").appendChild(chip);
                });

                document.querySelector('.chip[data-categoria=""]')?.addEventListener("click", function() {
                    filtroCategoria.value = "";
                    document.querySelectorAll(".chip").forEach(function(item) {
                        item.classList.toggle("activo", item.dataset.categoria === "");
                    });
                    renderizarProductos();
                });
            } catch (error) {
                console.error("Error al cargar categorías", error);
            }
        }

        function renderizarProductos() {
            const productos = obtenerProductosFiltrados();
            const totalVisibles = productosCatalogo.filter(function(producto) {
                return producto.estado !== "inactivo";
            }).length;

            contenedor.innerHTML = "";
            resumenCatalogo.textContent = productos.length + " de " + totalVisibles + " productos visibles";

            if (productos.length === 0) {
                contenedor.innerHTML = '<div class="estado-vacio">No encontramos productos con esos filtros.</div>';
                return;
            }

            productos.forEach(function(producto) {
                const agotado = Number(producto.cantidad) <= 0 || producto.estado === "agotado";
                const estadoTexto = agotado ? "Agotado" : "Disponible";
                const card = document.createElement("article");

                card.className = "card producto-card";
                card.innerHTML =
                    '<div class="producto-imagen-wrap">' +
                        '<img src="' + rutaImagenProducto(producto.imagen) + '" alt="' + producto.nombre + '">' +
                        '<span class="producto-badge ' + (agotado ? "agotado" : "disponible") + '">' + estadoTexto + '</span>' +
                    '</div>' +
                    '<div class="producto-card-body">' +
                        '<p class="producto-codigo">Codigo: ' + producto.codigo + '</p>' +
                        '<h3>' + producto.nombre + '</h3>' +
                        '<p class="producto-meta">' + producto.marca + '  -  ' + formatearCategoria(producto.categoria) + '</p>' +
                        '<p class="producto-precio">' + formatoPrecio(producto.precio) + '</p>' +
                        '<p class="producto-stock">' + estadoTexto + '</p>' +
                        '<p class="producto-stock">' + textoTallas(producto.tallas) + '</p>' +
                        '<button class="boton-comprar" ' + (agotado ? "disabled" : "") + '>' +
                            (agotado ? "Agotado" : "Comprar") +
                        '</button>' +
                    '</div>';

                card.querySelector("button").addEventListener("click", function() {
                    abrirModalCompra(producto);
                });

                contenedor.appendChild(card);
            });
        }

        async function cargarProductos() {
            contenedor.innerHTML = '<div class="estado-vacio">Cargando productos...</div>';

            try {
                const respuesta = await fetch("../php/productos_listar.php");
                const productos = await respuesta.json();

                if (productos.error) {
                    contenedor.innerHTML = "<p>Error: " + productos.mensaje + "</p>";
                    return;
                }

                productosCatalogo = productos;
                renderizarProductos();
            } catch (error) {
                contenedor.innerHTML = "<p>Error al cargar productos desde la base de datos.</p>";
                console.error(error);
            }
        }

        document.getElementById("formCompra").addEventListener("submit", registrarCompra);
        document.getElementById("btnCancelarCompra").addEventListener("click", cerrarModalCompra);
        document.getElementById("btnAgregarCarrito").addEventListener("click", agregarProductoAlCarrito);
        document.getElementById("btnAbrirCarrito").addEventListener("click", abrirCarrito);
        document.getElementById("btnCerrarCarrito").addEventListener("click", cerrarCarrito);
        document.getElementById("btnVaciarCarrito").addEventListener("click", function() {
            carrito = [];
            guardarCarrito();
            renderizarCarrito();
        });
        document.getElementById("modalCompra").addEventListener("click", function(evento) {
            if (evento.target.id === "modalCompra") {
                cerrarModalCompra();
            }
        });
        document.getElementById("modalCarrito").addEventListener("click", function(evento) {
            if (evento.target.id === "modalCarrito") {
                cerrarCarrito();
            }
        });

        buscador.addEventListener("input", renderizarProductos);
        filtroCategoria.addEventListener("change", function() {
            document.querySelectorAll(".chip").forEach(function(chip) {
                chip.classList.toggle("activo", chip.dataset.categoria === filtroCategoria.value);
            });
            renderizarProductos();
        });
        ordenProductos.addEventListener("change", renderizarProductos);
        soloDisponibles.addEventListener("change", renderizarProductos);

        actualizarContadorCarrito();
        cargarCategoriasCatalogo().then(cargarProductos);
    </script>

</body>
</html>
