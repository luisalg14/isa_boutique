<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Isa Boutique</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="public-page catalog-page stitch-catalog">

    <nav class="menu stitch-nav">
        <a class="nav-home-arrow" href="index.html" title="Volver al inicio">&larr;</a>
        <a class="brand-link" href="index.html">Isa Boutique</a>
        <a href="index.html">Inicio</a>
        <a href="Producto.html">Ver todo</a>
        <a href="categoria.html?tipo=blusas">Blusas</a>
        <a href="categoria.html?tipo=vestidos">Vestidos</a>
        <a href="categoria.html?tipo=conjuntos">Conjuntos</a>
        <a href="index.html#contacto">Contacto</a>
        <button class="cart-link" type="button" id="btnAbrirCarrito"><span class="cart-icon" aria-hidden="true">🛒</span> Carrito <span id="cartCount">0</span></button>
    </nav>

    <main class="tienda-layout">
        <header class="catalog-header">
            <span>Colecciones</span>
            <h1>Moda femenina</h1>
            <p>Descubre prendas disponibles, filtra por categoría y registra tu compra.</p>
        </header>

        <div class="stitch-catalog-grid">
            <aside class="stitch-filters">
                <p id="resumenCatalogo">Cargando catalogo...</p>

                <label class="filter-label" for="buscarProducto">Buscar</label>
                <input id="buscarProducto" type="search" placeholder="Nombre, marca o codigo">

                <label class="filter-label" for="filtroCategoria">Categoria</label>
                <select id="filtroCategoria">
                    <option value="">Todas</option>
                </select>

                <label class="filter-label" for="ordenProductos">Orden</label>
                <select id="ordenProductos">
                    <option value="recientes">Orden original</option>
                    <option value="precio_asc">Menor precio</option>
                    <option value="precio_desc">Mayor precio</option>
                    <option value="stock_desc">Mas disponibles</option>
                </select>

                <label class="check-control">
                    <input id="soloDisponibles" type="checkbox" checked>
                    Solo disponibles
                </label>

                <div class="categoria-chips" id="categoriaChips">
                    <button class="chip activo" data-categoria="">Todo</button>
                </div>
            </aside>

            <section class="galeria tienda-galeria">
                <div id="contenedor-productos" class="contenedor-productos"></div>
            </section>
        </div>
    </main>

    <div id="modalCompra" class="modal-compra" aria-hidden="true">
        <form id="formCompra" class="compra-modal">
            <div class="modal-header">
                <h2>Agregar al carrito</h2>
                <p id="resumenProducto">Selecciona un producto</p>
            </div>

            <div class="modal-body">
                <div class="campo">
                    <label for="compraColor">Color</label>
                    <select id="compraColor" required>
                        <option value="">Seleccionar color</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="compraTalla">Talla</label>
                    <input id="compraTalla" type="hidden" required>
                    <div id="compraTallaOpciones" class="size-options public-size-options"></div>
                </div>

                <div class="campo">
                    <label for="compraCantidad">Cantidad</label>
                    <input id="compraCantidad" type="number" min="1" required>
                </div>

                <div id="resumenCompraPublica" class="checkout-summary"></div>
                <p id="mensajeCompra" class="mensaje-compra"></p>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCancelarCompra">Cancelar</button>
                <button type="button" class="btn-confirmar" id="btnAgregarCarrito">Agregar al carrito</button>
            </div>
        </form>
    </div>

    <div id="modalCarrito" class="modal-compra" aria-hidden="true">
        <div class="compra-modal">
            <div class="modal-header">
                <h2>Carrito</h2>
                <p>Productos seleccionados antes de comprar.</p>
            </div>

            <div class="modal-body">
                <div id="listaCarrito" class="cart-list"></div>
                <p id="totalCarrito" class="producto-precio">$0</p>
                <div id="datosClienteCarrito" class="cart-checkout-form">
                    <div class="campo">
                        <label for="carritoCliente">Nombre del cliente</label>
                        <input id="carritoCliente" required>
                    </div>
                    <div class="campo">
                        <label for="carritoTelefono">Teléfono</label>
                        <input id="carritoTelefono" required>
                    </div>
                    <div class="campo">
                        <label for="carritoCorreo">Correo</label>
                        <input id="carritoCorreo" type="email" placeholder="correo@cliente.com">
                    </div>
                    <div class="campo">
                        <label for="carritoMedioPago">Medio de pago</label>
                        <select id="carritoMedioPago" required>
                            <option value="">Seleccionar</option>
                            <option value="efectivo">Efectivo</option>
                            <option value="transferencia">Transferencia</option>
                            <option value="tarjeta_debito">Tarjeta debito</option>
                            <option value="tarjeta_credito">Tarjeta credito</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="carritoEntrega">Entrega</label>
                        <select id="carritoEntrega" required>
                            <option value="">Seleccionar</option>
                            <option value="recoger_tienda">Recoger en tienda</option>
                            <option value="envio_local">Envio local</option>
                            <option value="envio_nacional">Envio nacional</option>
                        </select>
                    </div>
                    <p id="mensajeCarrito" class="mensaje-compra"></p>
                </div>
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCerrarCarrito">Cerrar</button>
                <button type="button" class="btn-cancelar" id="btnVaciarCarrito">Vaciar</button>
                <button type="button" class="btn-confirmar" id="btnComprarCarrito">Comprar carrito</button>
            </div>
        </div>
    </div>

    <div id="modalImagenProducto" class="modal-imagen-producto" aria-hidden="true">
        <button type="button" id="btnCerrarImagenProducto" aria-label="Cerrar imagen">&times;</button>
        <button type="button" class="imagen-nav imagen-prev" id="btnImagenAnterior" aria-label="Imagen anterior">‹</button>
        <img id="imagenProductoGrande" src="" alt="Producto">
        <button type="button" class="imagen-nav imagen-next" id="btnImagenSiguiente" aria-label="Imagen siguiente">›</button>
        <span id="contadorImagenProducto" class="imagen-contador"></span>
    </div>

    <script>
        function configurarFlechaRegresoPublica() {
            const flecha = document.querySelector(".nav-home-arrow");
            if (!flecha) return;

            let destino = "index.html";

            try {
                const regreso = JSON.parse(sessionStorage.getItem("isa_internal_return") || "null");
                if (regreso && regreso.url && (regreso.tipo === "admin" || regreso.tipo === "vendedor")) {
                    destino = regreso.url;
                }
            } catch (error) {
                destino = "index.html";
            }

            flecha.href = destino;
            flecha.title = destino === "index.html" ? "Volver al inicio" : "Volver al panel interno";
        }

        configurarFlechaRegresoPublica();

        let productoSeleccionado = null;
        let productosCatalogo = [];
        let categoriasCatalogo = [];
        let carrito = JSON.parse(localStorage.getItem("isa_carrito")) || [];
        let imagenesCarrusel = [];
        let indiceImagenCarrusel = 0;
        let paginaCatalogo = 1;
        const productosPorPaginaCatalogo = 100;

        const contenedor = document.getElementById("contenedor-productos");
        const buscador = document.getElementById("buscarProducto");
        const filtroCategoria = document.getElementById("filtroCategoria");
        const ordenProductos = document.getElementById("ordenProductos");
        const soloDisponibles = document.getElementById("soloDisponibles");
        const resumenCatalogo = document.getElementById("resumenCatalogo");

        function formatoPrecio(valor) {
            return "$" + Number(valor).toLocaleString("es-CO");
        }

        function rutaImagenProducto(ruta) {
            if (!ruta) return "../img/logo.png.png";
            if (ruta.startsWith("http") || ruta.startsWith("../")) return ruta;
            if (ruta.startsWith("img/")) return "../" + ruta;
            return ruta;
        }

        function leerImagenesProducto(imagenes) {
            if (Array.isArray(imagenes)) return imagenes;

            if (typeof imagenes === "string" && imagenes.trim() !== "") {
                try {
                    return JSON.parse(imagenes);
                } catch (error) {
                    return [];
                }
            }

            return [];
        }

        function imagenPrincipalProducto(producto) {
            const imagenes = leerImagenesProducto(producto.imagenes);
            const principal = imagenes.find(function(item) {
                return item.principal === true || item.principal === "t" || item.principal === 1;
            });

            return (principal && principal.ruta) || (imagenes[0] && imagenes[0].ruta) || producto.imagen;
        }

        function imagenesProductoPublicas(producto) {
            const imagenes = leerImagenesProducto(producto.imagenes)
                .map(function(item) {
                    return item.ruta;
                })
                .filter(Boolean);

            if (imagenes.length === 0 && producto.imagen) {
                imagenes.push(producto.imagen);
            }

            return [...new Set(imagenes)];
        }

        function miniaturasProducto(producto) {
            const imagenes = imagenesProductoPublicas(producto);

            if (imagenes.length <= 1) return "";

            return '<div class="producto-thumbs">' + imagenes.map(function(ruta, indice) {
                return '<button type="button" class="producto-thumb ' + (indice === 0 ? "activo" : "") + '" data-img="' + rutaImagenProducto(ruta) + '">' +
                    '<img src="' + rutaImagenProducto(ruta) + '" alt="' + producto.nombre + ' foto ' + (indice + 1) + '">' +
                '</button>';
            }).join("") + '</div>';
        }

        function mostrarImagenCarrusel() {
            const modal = document.getElementById("modalImagenProducto");
            const imagenGrande = document.getElementById("imagenProductoGrande");
            const contador = document.getElementById("contadorImagenProducto");
            const anterior = document.getElementById("btnImagenAnterior");
            const siguiente = document.getElementById("btnImagenSiguiente");

            if (imagenesCarrusel.length === 0) return;

            const actual = imagenesCarrusel[indiceImagenCarrusel];
            imagenGrande.src = actual.src;
            imagenGrande.alt = actual.alt || "Producto Isa Boutique";
            contador.textContent = (indiceImagenCarrusel + 1) + " / " + imagenesCarrusel.length;
            anterior.style.display = imagenesCarrusel.length > 1 ? "grid" : "none";
            siguiente.style.display = imagenesCarrusel.length > 1 ? "grid" : "none";
            modal.classList.add("activo");
            modal.setAttribute("aria-hidden", "false");
        }

        function abrirImagenProducto(imagen) {
            const card = imagen.closest(".producto-card");
            const imagenes = Array.from(card.querySelectorAll(".producto-thumb img"));

            imagenesCarrusel = imagenes.length > 0
                ? imagenes.map(function(item) {
                    return { src: item.src, alt: item.alt };
                })
                : [{ src: imagen.src, alt: imagen.alt }];

            indiceImagenCarrusel = Math.max(0, imagenesCarrusel.findIndex(function(item) {
                return item.src === imagen.src;
            }));

            mostrarImagenCarrusel();
        }

        function cambiarImagenCarrusel(direccion) {
            if (imagenesCarrusel.length <= 1) return;
            indiceImagenCarrusel = (indiceImagenCarrusel + direccion + imagenesCarrusel.length) % imagenesCarrusel.length;
            mostrarImagenCarrusel();
        }

        function cerrarImagenProducto() {
            const modal = document.getElementById("modalImagenProducto");
            const imagenGrande = document.getElementById("imagenProductoGrande");

            modal.classList.remove("activo");
            modal.setAttribute("aria-hidden", "true");
            imagenGrande.src = "";
            imagenesCarrusel = [];
            indiceImagenCarrusel = 0;
        }

        function formatearCategoria(categoria) {
            const encontrada = categoriasCatalogo.find(function(item) {
                return item.nombre === categoria;
            });

            if (encontrada) {
                return encontrada.nombre.replaceAll("-", " ").replace(/\b\w/g, function(letra) {
                    return letra.toUpperCase();
                });
            }

            return categoria ? categoria.replaceAll("-", " ") : "Sin categoría";
        }

        function leerTallas(tallas) {
            if (Array.isArray(tallas)) return tallas;

            if (typeof tallas === "string" && tallas.trim() !== "") {
                try {
                    return JSON.parse(tallas);
                } catch (error) {
                    return [];
                }
            }

            return [];
        }

        function leerColores(colores) {
            if (Array.isArray(colores)) return colores;

            if (typeof colores === "string" && colores.trim() !== "") {
                try {
                    return JSON.parse(colores);
                } catch (error) {
                    return [];
                }
            }

            return [];
        }

        function obtenerColorCompra(producto) {
            const selector = document.getElementById("compraColor");
            const idColor = Number(selector?.value || 0);
            const colores = leerColores(producto ? producto.colores : []);

            return colores.find(function(item) {
                return Number(item.id_producto_color) === idColor;
            }) || null;
        }

        function textoColores(producto) {
            const colores = leerColores(producto ? producto.colores : []);

            if (colores.length === 0) {
                return producto && producto.color ? producto.color : "";
            }

            return colores.map(function(item) {
                return item.color;
            }).join(", ");
        }

        function textoTallas(tallas) {
            const lista = leerTallas(tallas);

            if (lista.length === 0) return "Sin tallas disponibles";

            return "Tallas disponibles: " + lista.map(function(item) {
                const cantidad = Number(item.cantidad);

                if (cantidad <= 0) {
                    return item.talla + " agotada";
                }

                if (cantidad < 4) {
                    return item.talla + " (ultimas " + cantidad + ")";
                }

                return item.talla;
            }).join(", ");
        }

        function colorTieneStock(color) {
            return leerTallas(color ? color.tallas : []).some(function(item) {
                return Number(item.cantidad) > 0;
            });
        }

        function actualizarContadorCarrito() {
            const total = carrito.reduce(function(suma, item) {
                return suma + Number(item.cantidad);
            }, 0);

            document.getElementById("cartCount").textContent = total;
        }

        function guardarCarrito() {
            localStorage.setItem("isa_carrito", JSON.stringify(carrito));
            actualizarContadorCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById("listaCarrito");
            const datosCliente = document.getElementById("datosClienteCarrito");
            const botonComprar = document.getElementById("btnComprarCarrito");
            const total = carrito.reduce(function(suma, item) {
                return suma + Number(item.precio) * Number(item.cantidad);
            }, 0);

            if (carrito.length === 0) {
                lista.innerHTML = '<p>Tu carrito esta vacio.</p>';
                document.getElementById("totalCarrito").textContent = "$0";
                datosCliente.style.display = "none";
                botonComprar.style.display = "none";
                return;
            }

            datosCliente.style.display = "grid";
            botonComprar.style.display = "";
            lista.innerHTML = "";

            carrito.forEach(function(item, indice) {
                const fila = document.createElement("div");
                fila.className = "cart-item";
                fila.innerHTML =
                    '<div>' +
                        '<strong>' + item.nombre + '</strong>' +
                        '<p>Color: ' + (item.color || '-') + ' | Talla: ' + item.talla + ' | Cantidad: ' + item.cantidad + '</p>' +
                        '<p>' + formatoPrecio(Number(item.precio) * Number(item.cantidad)) + '</p>' +
                    '</div>' +
                    '<button type="button">Quitar</button>';

                fila.querySelector("button").addEventListener("click", function() {
                    carrito.splice(indice, 1);
                    guardarCarrito();
                    renderizarCarrito();
                });

                lista.appendChild(fila);
            });

            document.getElementById("totalCarrito").textContent = "Total carrito: " + formatoPrecio(total);
        }

        function abrirCarrito() {
            renderizarCarrito();
            const modal = document.getElementById("modalCarrito");
            modal.classList.add("activo");
            modal.setAttribute("aria-hidden", "false");
        }

        function cerrarCarrito() {
            const modal = document.getElementById("modalCarrito");
            modal.classList.remove("activo");
            modal.setAttribute("aria-hidden", "true");
        }

        function llenarColoresCompra(producto) {
            const selector = document.getElementById("compraColor");
            selector.innerHTML = '<option value="">Seleccionar color</option>';

            const colores = leerColores(producto.colores);

            if (colores.length === 0 && producto.color) {
                const opcion = document.createElement("option");
                opcion.value = "";
                opcion.textContent = producto.color;
                selector.appendChild(opcion);
            }

            colores.forEach(function(item) {
                const opcion = document.createElement("option");
                opcion.value = item.id_producto_color;
                const disponible = colorTieneStock(item);
                opcion.textContent = disponible ? item.color : item.color + " - agotado";
                opcion.disabled = !disponible;
                selector.appendChild(opcion);
            });

            const primeraDisponible = Array.from(selector.options).find(function(opcion) {
                return opcion.value !== "" && !opcion.disabled;
            });

            if (primeraDisponible) {
                selector.value = primeraDisponible.value;
            } else if (selector.options.length === 2) {
                selector.selectedIndex = 1;
            }

            llenarTallasCompra(producto);
        }

        function llenarTallasCompra(producto) {
            const input = document.getElementById("compraTalla");
            const contenedor = document.getElementById("compraTallaOpciones");
            input.value = "";
            contenedor.innerHTML = "";

            const colorSeleccionado = obtenerColorCompra(producto);
            const tallas = colorSeleccionado ? colorSeleccionado.tallas : producto.tallas;

            leerTallas(tallas)
                .forEach(function(item) {
                    const cantidad = Number(item.cantidad);
                    const boton = document.createElement("button");
                    boton.type = "button";
                    boton.className = "size-option";
                    boton.dataset.talla = item.talla;
                    boton.dataset.cantidad = item.cantidad;
                    boton.disabled = cantidad <= 0;
                    boton.textContent = cantidad > 0 && cantidad < 4
                        ? item.talla + " - ultimas " + cantidad
                        : item.talla;

                    if (cantidad <= 0) {
                        boton.classList.add("agotada");
                        boton.title = "Talla agotada";
                    }

                    boton.addEventListener("click", function() {
                        if (boton.disabled) return;
                        input.value = item.talla;
                        document.getElementById("compraCantidad").max = item.cantidad;
                        contenedor.querySelectorAll(".size-option").forEach(function(opcion) {
                            opcion.classList.toggle("activo", opcion === boton);
                        });
                    });
                    contenedor.appendChild(boton);
                });

            const primera = contenedor.querySelector(".size-option:not(:disabled)");
            if (primera) {
                primera.click();
            }
        }

        function abrirModalCompra(producto) {
            if (Number(producto.cantidad) <= 0 || producto.estado === "agotado") {
                alert("Este producto esta agotado.");
                return;
            }

            productoSeleccionado = producto;
            document.getElementById("resumenProducto").textContent =
                producto.nombre + " - " + formatoPrecio(producto.precio) + " | Disponibles: " + producto.cantidad;
            document.getElementById("compraCantidad").value = "1";
            document.getElementById("compraCantidad").max = producto.cantidad;
            llenarColoresCompra(producto);
            document.getElementById("mensajeCompra").textContent = "";
            actualizarResumenCompraPublica();

            const modal = document.getElementById("modalCompra");
            modal.classList.add("activo");
            modal.setAttribute("aria-hidden", "false");
        }

        function actualizarResumenCompraPublica() {
            const contenedor = document.getElementById("resumenCompraPublica");
            if (!contenedor) return;

            const cantidad = Number(document.getElementById("compraCantidad")?.value || 1);
            const total = productoSeleccionado ? Number(productoSeleccionado.precio) * cantidad : 0;
            const base = total / 1.19;
            const iva = total - base;

            contenedor.innerHTML = `
                <div><span>Total estimado</span><strong>${formatoPrecio(total)}</strong></div>
                <div><span>IVA incluido</span><strong>${formatoPrecio(iva)}</strong></div>
                <p>Tu pedido queda pendiente hasta que Isa Boutique confirme el pago.</p>
            `;
        }

        function cerrarModalCompra() {
            const modal = document.getElementById("modalCompra");
            modal.classList.remove("activo");
            modal.setAttribute("aria-hidden", "true");
            productoSeleccionado = null;
        }

        function agregarProductoAlCarrito() {
            if (!productoSeleccionado) return;

            const cantidad = parseInt(document.getElementById("compraCantidad").value);
            const talla = document.getElementById("compraTalla").value;
            const colorSeleccionado = obtenerColorCompra(productoSeleccionado);
            const mensaje = document.getElementById("mensajeCompra");

            if (!talla) {
                mensaje.textContent = "Selecciona una talla.";
                return;
            }

            if (isNaN(cantidad) || cantidad <= 0) {
                mensaje.textContent = "Ingresa una cantidad valida.";
                return;
            }

            const tallas = colorSeleccionado ? colorSeleccionado.tallas : productoSeleccionado.tallas;
            const tallaSeleccionada = leerTallas(tallas).find(function(item) {
                return item.talla === talla;
            });

            const existente = carrito.find(function(item) {
                return Number(item.id_producto) === Number(productoSeleccionado.id_producto)
                    && item.talla === talla
                    && String(item.id_producto_color || "") === String(colorSeleccionado ? colorSeleccionado.id_producto_color : "");
            });
            const cantidadFinal = Number(existente ? existente.cantidad : 0) + cantidad;

            if (!tallaSeleccionada || cantidadFinal > Number(tallaSeleccionada.cantidad)) {
                mensaje.textContent = "No hay suficientes unidades en esa talla.";
                return;
            }

            if (existente) {
                existente.cantidad = cantidadFinal;
            } else {
                carrito.push({
                id_producto: productoSeleccionado.id_producto,
                id_producto_color: colorSeleccionado ? colorSeleccionado.id_producto_color : "",
                codigo: productoSeleccionado.codigo,
                nombre: productoSeleccionado.nombre,
                precio: productoSeleccionado.precio,
                color: colorSeleccionado ? colorSeleccionado.color : document.getElementById("compraColor").selectedOptions[0]?.textContent || "",
                talla: talla,
                cantidad: cantidad
                });
            }

            guardarCarrito();
            cerrarModalCompra();
            abrirCarrito();
        }

        async function finalizarCompraCarrito() {
            const mensaje = document.getElementById("mensajeCarrito");
            const cliente = document.getElementById("carritoCliente").value.trim();
            const telefono = document.getElementById("carritoTelefono").value.trim();
            const correo = document.getElementById("carritoCorreo").value.trim();
            const medioPago = document.getElementById("carritoMedioPago").value;
            const tipoEntrega = document.getElementById("carritoEntrega").value;

            mensaje.textContent = "";

            if (carrito.length === 0) {
                mensaje.textContent = "Tu carrito está vacío.";
                return;
            }

            if (!cliente || !telefono || !medioPago || !tipoEntrega) {
                mensaje.textContent = "Completa tus datos para finalizar la compra.";
                return;
            }

            try {
                for (const item of carrito) {
                    const datos = new FormData();
                    datos.append("id_producto", item.id_producto);
                    datos.append("id_producto_color", item.id_producto_color || "");
                    datos.append("color", item.color || "");
                    datos.append("talla", item.talla);
                    datos.append("cantidad", item.cantidad);
                    datos.append("cliente", cliente);
                    datos.append("telefono", telefono);
                    datos.append("correo", correo);
                    datos.append("medio_pago", medioPago);
                    datos.append("canal_venta", "pagina_web");
                    datos.append("tipo_entrega", tipoEntrega);

                    const respuesta = await fetch("../php/venta_registrar.php", {
                        method: "POST",
                        body: datos
                    });
                    const resultado = await respuesta.json();

                    if (resultado.error) {
                        mensaje.textContent = resultado.mensaje;
                        return;
                    }
                }

                carrito = [];
                guardarCarrito();
                renderizarCarrito();
                cerrarCarrito();
                await cargarProductos();
                alert("Compra registrada correctamente. Tu pedido queda pendiente de confirmación.");
            } catch (error) {
                mensaje.textContent = "Error al finalizar la compra.";
                console.error(error);
            }
        }

        function obtenerProductosFiltrados() {
            const texto = buscador.value.trim().toLowerCase();
            const categoria = filtroCategoria.value;
            const soloStock = soloDisponibles.checked;

            let productos = productosCatalogo.filter(function(producto) {
                const activo = producto.estado !== "inactivo";
                const disponible = Number(producto.cantidad) > 0 && producto.estado !== "agotado";
                const coincideTexto = (
                    (producto.nombre || "").toLowerCase().includes(texto) ||
                    (producto.marca || "").toLowerCase().includes(texto) ||
                    (producto.codigo || "").toLowerCase().includes(texto)
                );
                const coincideCategoria = !categoria || producto.categoria === categoria;

                return activo && coincideTexto && coincideCategoria && (!soloStock || disponible);
            });

            if (ordenProductos.value === "precio_asc") {
                productos.sort(function(a, b) { return Number(a.precio) - Number(b.precio); });
            } else if (ordenProductos.value === "precio_desc") {
                productos.sort(function(a, b) { return Number(b.precio) - Number(a.precio); });
            } else if (ordenProductos.value === "stock_desc") {
                productos.sort(function(a, b) { return Number(b.cantidad) - Number(a.cantidad); });
            }

            return productos;
        }

        function renderizarPaginacionCatalogo(totalProductos) {
            let paginacion = document.getElementById("paginacionCatalogo");

            if (!paginacion) {
                paginacion = document.createElement("div");
                paginacion.id = "paginacionCatalogo";
                paginacion.className = "pagination-control public-pagination";
                contenedor.insertAdjacentElement("afterend", paginacion);
            }

            const totalPaginas = Math.ceil(totalProductos / productosPorPaginaCatalogo);
            paginacion.innerHTML = "";

            if (totalPaginas <= 1) {
                paginacion.hidden = true;
                return;
            }

            paginacion.hidden = false;

            if (paginaCatalogo > totalPaginas) {
                paginaCatalogo = totalPaginas;
            }

            const crearBoton = function(texto, pagina, activo, deshabilitado) {
                const boton = document.createElement("button");
                boton.type = "button";
                boton.textContent = texto;
                boton.className = activo ? "activo" : "";
                boton.disabled = deshabilitado;
                boton.addEventListener("click", function() {
                    paginaCatalogo = pagina;
                    renderizarProductos();
                    contenedor.scrollIntoView({ behavior: "smooth", block: "start" });
                });
                paginacion.appendChild(boton);
            };

            crearBoton("‹", paginaCatalogo - 1, false, paginaCatalogo === 1);

            const inicio = Math.max(1, paginaCatalogo - 2);
            const fin = Math.min(totalPaginas, paginaCatalogo + 2);

            if (inicio > 1) {
                crearBoton("1", 1, paginaCatalogo === 1, false);
                if (inicio > 2) {
                    const puntos = document.createElement("span");
                    puntos.textContent = "...";
                    paginacion.appendChild(puntos);
                }
            }

            for (let pagina = inicio; pagina <= fin; pagina++) {
                crearBoton(String(pagina), pagina, pagina === paginaCatalogo, false);
            }

            if (fin < totalPaginas) {
                if (fin < totalPaginas - 1) {
                    const puntos = document.createElement("span");
                    puntos.textContent = "...";
                    paginacion.appendChild(puntos);
                }
                crearBoton(String(totalPaginas), totalPaginas, paginaCatalogo === totalPaginas, false);
            }

            crearBoton("Next ›", paginaCatalogo + 1, false, paginaCatalogo === totalPaginas);
        }

        function reiniciarPaginaCatalogo() {
            paginaCatalogo = 1;
            renderizarProductos();
        }

        async function cargarCategoriasCatalogo() {
            try {
                const respuesta = await fetch("../php/categorias_listar.php?solo_activas=1");
                const categorias = await respuesta.json();

                if (categorias.error) {
                    console.error(categorias.mensaje);
                    return;
                }

                categoriasCatalogo = categorias;
                filtroCategoria.innerHTML = '<option value="">Todas</option>';
                document.getElementById("categoriaChips").innerHTML = '<button class="chip activo" data-categoria="">Todo</button>';

                categorias.forEach(function(categoria) {
                    const texto = formatearCategoria(categoria.nombre);
                    const opcion = document.createElement("option");
                    opcion.value = categoria.nombre;
                    opcion.textContent = texto;
                    filtroCategoria.appendChild(opcion);

                    const chip = document.createElement("button");
                    chip.className = "chip";
                    chip.dataset.categoria = categoria.nombre;
                    chip.textContent = texto;
                    chip.addEventListener("click", function() {
                        filtroCategoria.value = chip.dataset.categoria;
                        document.querySelectorAll(".chip").forEach(function(item) {
                            item.classList.remove("activo");
                        });
                        chip.classList.add("activo");
                        reiniciarPaginaCatalogo();
                    });
                    document.getElementById("categoriaChips").appendChild(chip);
                });

                document.querySelector('.chip[data-categoria=""]')?.addEventListener("click", function() {
                    filtroCategoria.value = "";
                    document.querySelectorAll(".chip").forEach(function(item) {
                        item.classList.toggle("activo", item.dataset.categoria === "");
                    });
                    reiniciarPaginaCatalogo();
                });
            } catch (error) {
                console.error("Error al cargar categorías", error);
            }
        }

        function renderizarProductos() {
            const productos = obtenerProductosFiltrados();
            const totalVisibles = productosCatalogo.filter(function(producto) {
                return producto.estado !== "inactivo";
            }).length;

            contenedor.innerHTML = "";
            resumenCatalogo.textContent = productos.length + " de " + totalVisibles + " productos visibles";

            if (productos.length === 0) {
                contenedor.innerHTML = '<div class="estado-vacio">No encontramos productos con esos filtros.</div>';
                renderizarPaginacionCatalogo(0);
                return;
            }

            const totalPaginas = Math.max(1, Math.ceil(productos.length / productosPorPaginaCatalogo));
            if (paginaCatalogo > totalPaginas) paginaCatalogo = totalPaginas;

            const inicio = (paginaCatalogo - 1) * productosPorPaginaCatalogo;
            const productosPagina = productos.slice(inicio, inicio + productosPorPaginaCatalogo);

            productosPagina.forEach(function(producto) {
                const agotado = Number(producto.cantidad) <= 0 || producto.estado === "agotado";
                const estadoTexto = agotado ? "Agotado" : "Disponible";
                const card = document.createElement("article");

                card.className = "card producto-card";
                card.innerHTML =
                    '<div class="producto-imagen-wrap">' +
                        '<img class="producto-img-click" src="' + rutaImagenProducto(imagenPrincipalProducto(producto)) + '" alt="' + producto.nombre + '">' +
                        '<span class="producto-badge ' + (agotado ? "agotado" : "disponible") + '">' + estadoTexto + '</span>' +
                    '</div>' +
                    miniaturasProducto(producto) +
                    '<div class="producto-card-body">' +
                        '<p class="producto-codigo">Codigo: ' + producto.codigo + '</p>' +
                        '<h3>' + producto.nombre + '</h3>' +
                        '<p class="producto-meta">' + producto.marca + '  -  ' + formatearCategoria(producto.categoria) + (textoColores(producto) ? '  -  ' + textoColores(producto) : '') + '</p>' +
                        '<p class="producto-precio">' + formatoPrecio(producto.precio) + '</p>' +
                        '<p class="producto-stock">' + estadoTexto + '</p>' +
                        '<p class="producto-stock">' + textoTallas(producto.tallas) + '</p>' +
                        '<button class="boton-comprar" ' + (agotado ? "disabled" : "") + '>' +
                            (agotado ? "Agotado" : "Comprar") +
                        '</button>' +
                    '</div>';

                card.querySelector(".boton-comprar").addEventListener("click", function() {
                    abrirModalCompra(producto);
                });

                contenedor.appendChild(card);
            });

            renderizarPaginacionCatalogo(productos.length);
        }

        async function cargarProductos() {
            contenedor.innerHTML = '<div class="estado-vacio">Cargando productos...</div>';

            try {
                const respuesta = await fetch("../php/productos_listar.php");
                const productos = await respuesta.json();

                if (productos.error) {
                    contenedor.innerHTML = "<p>Error: " + productos.mensaje + "</p>";
                    return;
                }

                productosCatalogo = productos;
                renderizarProductos();
            } catch (error) {
                contenedor.innerHTML = "<p>Error al cargar productos desde la base de datos.</p>";
                console.error(error);
            }
        }

        document.getElementById("formCompra").addEventListener("submit", function(evento) {
            evento.preventDefault();
            agregarProductoAlCarrito();
        });
        document.getElementById("btnCancelarCompra").addEventListener("click", cerrarModalCompra);
        document.getElementById("btnAgregarCarrito").addEventListener("click", agregarProductoAlCarrito);
        document.getElementById("btnAbrirCarrito").addEventListener("click", abrirCarrito);
        document.getElementById("compraColor").addEventListener("change", function() {
            if (productoSeleccionado) {
                llenarTallasCompra(productoSeleccionado);
                actualizarResumenCompraPublica();
            }
        });
        document.getElementById("compraCantidad").addEventListener("input", actualizarResumenCompraPublica);
        document.getElementById("btnCerrarCarrito").addEventListener("click", cerrarCarrito);
        document.getElementById("btnComprarCarrito").addEventListener("click", finalizarCompraCarrito);
        document.getElementById("btnCerrarImagenProducto").addEventListener("click", cerrarImagenProducto);
        document.getElementById("btnImagenAnterior").addEventListener("click", function() {
            cambiarImagenCarrusel(-1);
        });
        document.getElementById("btnImagenSiguiente").addEventListener("click", function() {
            cambiarImagenCarrusel(1);
        });
        document.getElementById("btnVaciarCarrito").addEventListener("click", function() {
            carrito = [];
            guardarCarrito();
            renderizarCarrito();
        });
        document.getElementById("modalCompra").addEventListener("click", function(evento) {
            if (evento.target.id === "modalCompra") {
                cerrarModalCompra();
            }
        });
        document.getElementById("modalCarrito").addEventListener("click", function(evento) {
            if (evento.target.id === "modalCarrito") {
                cerrarCarrito();
            }
        });
        document.getElementById("modalImagenProducto").addEventListener("click", function(evento) {
            if (evento.target.id === "modalImagenProducto") {
                cerrarImagenProducto();
            }
        });
        contenedor.addEventListener("click", function(evento) {
            const miniatura = evento.target.closest(".producto-thumb");
            if (miniatura) {
                const card = miniatura.closest(".producto-card");
                const imagenPrincipal = card.querySelector(".producto-img-click");
                imagenPrincipal.src = miniatura.dataset.img;
                card.querySelectorAll(".producto-thumb").forEach(function(item) {
                    item.classList.toggle("activo", item === miniatura);
                });
                return;
            }

            const imagen = evento.target.closest(".producto-img-click");
            if (imagen) {
                abrirImagenProducto(imagen);
            }
        });

        buscador.addEventListener("input", reiniciarPaginaCatalogo);
        filtroCategoria.addEventListener("change", function() {
            document.querySelectorAll(".chip").forEach(function(chip) {
                chip.classList.toggle("activo", chip.dataset.categoria === filtroCategoria.value);
            });
            reiniciarPaginaCatalogo();
        });
        ordenProductos.addEventListener("change", reiniciarPaginaCatalogo);
        soloDisponibles.addEventListener("change", reiniciarPaginaCatalogo);

        actualizarContadorCarrito();
        cargarCategoriasCatalogo().then(cargarProductos);
    </script>

</body>
