<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contrasena - Isa Boutique</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <main id="loginBox">
        <div class="login-content">
            <h2>Restablecer contrasena</h2>

            <input type="password" id="passwordNueva" placeholder="Nueva contrasena" autocomplete="new-password">
            <input type="password" id="passwordConfirmar" placeholder="Confirmar contrasena" autocomplete="new-password">

            <button id="btnRestablecer" type="button">Guardar nueva contrasena</button>
            <p id="mensaje"></p>
            <a class="login-link mail-login-link" href="admin.html">
                <span class="gmail-mark" aria-hidden="true"><i></i><b></b><em></em></span>
                Volver al ingreso
            </a>
        </div>
    </main>

    <script>
        function rutaApiRestablecer(archivo) {
            const partesRuta = window.location.pathname.split("/").filter(Boolean);
            const indiceHtml = partesRuta.indexOf("html");
            const baseProyecto = indiceHtml > 0 ? "/" + partesRuta.slice(0, indiceHtml).join("/") + "/" : "/";
            const base = window.location.hostname === "localhost" ? baseProyecto : "/";

            return base + "php/" + archivo;
        }

        async function restablecerPassword() {
            const mensaje = document.getElementById("mensaje");
            const token = new URLSearchParams(window.location.search).get("token") || "";
            const datos = new FormData();

            datos.append("token", token);
            datos.append("password_nueva", document.getElementById("passwordNueva").value);
            datos.append("password_confirmar", document.getElementById("passwordConfirmar").value);

            try {
                const respuesta = await fetch(rutaApiRestablecer("password_recuperar_confirmar.php"), {
                    method: "POST",
                    body: datos
                });
                const resultado = await respuesta.json();

                mensaje.textContent = resultado.mensaje;

                if (!resultado.error) {
                    document.getElementById("passwordNueva").value = "";
                    document.getElementById("passwordConfirmar").value = "";
                }
            } catch (error) {
                mensaje.textContent = "No se pudo actualizar la contrasena.";
                console.error(error);
            }
        }

        document.getElementById("btnRestablecer").addEventListener("click", restablecerPassword);
        document.getElementById("passwordConfirmar").addEventListener("keydown", function(evento) {
            if (evento.key === "Enter") {
                restablecerPassword();
            }
        });
    </script>
</body>
</html>
